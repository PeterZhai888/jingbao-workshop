# Render 一键部署配置（Blueprints）
# 使用方式：Render Dashboard → Blueprints → "New Blueprint Instance"
# 选择你的 jingbao-workshop 仓库，Render 会自动读取此文件完成部署
#
# 注：首次部署完成后，需在 Render 控制台手动填入以下运行期环境变量（在此不便明文提交）：
#   JWT_SECRET              32 位随机密钥（openssl rand -hex 32 生成）
#   CONFIG_ENCRYPTION_KEY   32 位随机密钥（openssl rand -hex 32 生成）
services:
  - type: web
    name: jingbao-workshop
    runtime: node
    region: singapore   # 新加坡节点，国内用户访问延迟较低
    plan: free          # 先免费试跑；稳定后改 starter(7$/月) 去掉休眠
    numInstances: 1

    # 构建（Render 会先自动跑 pnpm install --frozen-lockfile，这里只做构建）
    buildCommand: |
      set -euo pipefail
      export NEXT_TELEMETRY_DISABLED=1
      export NEXT_PRIVATE_NTBA_CPUS=2
      # 防止构建期内存收紧（free 实例 512M，给 400M heap 足够）
      export NODE_OPTIONS="--max-old-space-size=400"
      rm -f .babelrc babel.config.*
      echo "[Step 1/4] TypeScript 类型检查（单进程）..."
      pnpm tsc -p tsconfig.json --noEmit
      echo "[Step 2/4] Next.js 生产构建（跳过 Next 内置 TypeScript 步骤）..."
      pnpm next build
      echo "[Step 3/4] 打包 server + config..."
      pnpm tsup src/server.ts src/lib/server/config.ts --format cjs --platform node --target node20 --outDir dist --no-splitting --no-minify
      echo "[Step 4/4] 拷贝启动入口..."
      cp src/startup.ts dist/startup.js

    # 启动
    startCommand: |
      export NODE_ENV=production
      export NEXT_TELEMETRY_DISABLED=1
      # 免费实例 512M heap 上限 400M；starter 1G 内存可改到 800
      export NODE_OPTIONS="--max-old-space-size=400"
      node dist/startup.js

    # 环境变量（不含密钥，密钥在部署后 UI 手动填或用 Render Secret File）
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Render 免费持久磁盘挂载点（文档推荐 /var/data）
      - key: DB_PATH
        value: /var/data/jingbao.db
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"   # Render 默认监听 10000，配一下安全

    # 免费持久磁盘（免费版 1GB，足够 SQLite 用很久）
    disk:
      name: jingbao-data
      mountPath: /var/data
      sizeGB: 1

    # 健康检查与自动重启
    healthCheckPath: /
    autoDeploy: yes   # git push main 自动重新部署
